<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マダムさとえの辛口ゴルフ診断</title>
<style>
:root{
  --ink:#17101f;
  --velvet:#3d1a33;
  --velvet-lit:#4e2342;
  --gold:#c9a227;
  --gold-lit:#e8c96a;
  --teal:#17968f;
  --teal-lit:#38bdb4;
  --cream:#f4ecda;
  --cream-dim:#c9bda5;
  --vivi-orange:#ef7c1a;
  --serif:"Yu Mincho","YuMincho","Hiragino Mincho ProN","HGS明朝E",serif;
  --sans:"Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Meiryo",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ink);
  color:var(--cream);
  font-family:var(--sans);
  font-size:18px;
  line-height:1.9;
  padding:0 0 60px;
}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}

/* ---- 金の罫と札の意匠 ---- */
.plate{
  border:1px solid var(--gold);
  background:var(--velvet);
  padding:26px 22px;
  position:relative;
}
.plate::before{
  content:"";position:absolute;inset:5px;
  border:1px solid rgba(201,162,39,.38);
  pointer-events:none;
}
.rule{
  height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);
  margin:26px 0;
}

/* ---- 表紙 ---- */
.hero{padding-top:30px}
.hero-img{
  display:block;width:100%;height:auto;
  border:1px solid var(--gold);
}
.hero-fallback{
  display:none;width:100%;aspect-ratio:4/5;
  background:var(--velvet);border:1px solid var(--gold);
  align-items:center;justify-content:center;
  font-family:var(--serif);font-size:60px;color:var(--gold);
}
.eyebrow{
  font-family:var(--serif);font-size:17px;color:var(--teal-lit);
  letter-spacing:.22em;margin-bottom:12px;
}
h1{
  font-family:var(--serif);
  font-size:40px;line-height:1.35;font-weight:600;
  color:var(--gold-lit);margin:22px 0 16px;
}
.lede{font-size:18px;color:var(--cream);margin-bottom:6px}
.note{font-size:16px;color:var(--cream-dim);line-height:1.85}

/* ---- ボタン ---- */
.btn{
  display:block;width:100%;
  font-family:var(--sans);font-size:21px;font-weight:700;
  color:var(--ink);background:var(--gold);
  border:none;padding:20px;margin-top:26px;
  cursor:pointer;letter-spacing:.05em;
}
.btn:hover{background:var(--gold-lit)}
.btn:focus-visible{outline:3px solid var(--teal-lit);outline-offset:3px}
.btn-quiet{
  background:transparent;color:var(--gold-lit);
  border:1px solid var(--gold);font-size:18px;padding:16px;
}
.btn-quiet:hover{background:rgba(201,162,39,.14)}

/* ---- 設問 ---- */
.qhead{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.qicon{width:56px;height:56px;border:1px solid var(--gold);flex-shrink:0;object-fit:cover}
.qcount{font-family:var(--serif);font-size:20px;color:var(--gold-lit)}
.qbar{height:3px;background:rgba(244,236,218,.16);margin-top:8px}
.qbar span{display:block;height:100%;background:var(--teal-lit);transition:width .3s}
.qtext{
  font-family:var(--serif);font-size:25px;line-height:1.6;
  color:var(--cream);margin-bottom:8px;
}
.opt{
  display:block;width:100%;text-align:left;
  font-family:var(--sans);font-size:19px;line-height:1.65;
  color:var(--cream);background:var(--velvet-lit);
  border:1px solid rgba(201,162,39,.45);
  padding:18px 20px;margin-top:14px;cursor:pointer;
}
.opt:hover{border-color:var(--gold-lit);background:#5b2a4e}
.opt:focus-visible{outline:3px solid var(--teal-lit);outline-offset:2px}

/* ---- 結果 ---- */
.result-lead{font-family:var(--serif);font-size:19px;color:var(--teal-lit);margin-bottom:10px}
.title-name{
  font-family:var(--serif);
  font-size:36px;line-height:1.4;font-weight:600;
  color:var(--gold-lit);margin-bottom:6px;
}
.bust{display:block;width:100%;height:auto;border:1px solid var(--gold);margin:22px 0}
.verdict{font-size:18px;line-height:2.05;margin-bottom:20px}
.verdict p+p{margin-top:18px}
.stat{
  display:flex;align-items:baseline;gap:12px;
  border-top:1px solid rgba(201,162,39,.4);
  border-bottom:1px solid rgba(201,162,39,.4);
  padding:16px 0;margin:24px 0;
}
.stat-label{font-size:17px;color:var(--cream-dim)}
.stat-value{font-family:var(--serif);font-size:34px;font-weight:700;color:var(--vivi-orange)}
.rx{
  background:rgba(23,150,143,.16);
  border-left:5px solid var(--teal-lit);
  padding:18px 20px;margin-top:22px;
}
.rx-label{font-size:16px;color:var(--teal-lit);margin-bottom:6px}
.rx-body{font-size:20px;font-weight:700;line-height:1.7}
.pair{font-size:17px;color:var(--cream-dim);margin-top:20px}
.pair b{color:var(--gold-lit);font-size:19px}

footer{
  text-align:center;margin-top:40px;
  font-size:15px;line-height:1.9;color:var(--cream-dim);
}
footer b{color:var(--vivi-orange)}

.screen{display:none}
.screen.on{display:block;animation:rise .45s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .screen.on{animation:none}
  .qbar span{transition:none}
}
@media(max-width:380px){
  h1{font-size:34px}
  .title-name{font-size:30px}
  .qtext{font-size:22px}
}
</style>
</head>

        "道具は古いまま、口数も少ないまま。ただ淡々と刻んで、淡々と沈める。誰にも褒められないけれど、マダムはちゃんと見ていましたからね。"],
  rx:"たまには一度だけ、ドライバーで池を越えてごらんなさい。人生が少し賑やかになるわ。" }
};

let idx=0, sc={R:0,K:0,G:0,J:0,S:0,M:0};
const $=id=>document.getElementById(id);
const show=id=>{document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');window.scrollTo(0,0);};
const KANJI=["一","二","三","四","五","六","七","八"];

function render(){
  const q=QUESTIONS[idx];
  $('qcount').textContent="第"+KANJI[idx]+"問";
  $('qbar').style.width=((idx)/QUESTIONS.length*100)+"%";
  $('qtext').textContent=q.q;
  const box=$('opts'); box.innerHTML="";
  q.a.forEach(o=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=o.t;
    b.onclick=()=>{ for(const k in o.s) sc[k]+=o.s[k];
      idx++; idx<QUESTIONS.length ? render() : finish(); };
    box.appendChild(b);
  });
}

function finish(){
  const key=(sc.R>=sc.K?"R":"K")+(sc.G>=sc.J?"G":"J")+(sc.S>=sc.M?"S":"M");
  const t=TYPES[key];
  $('rName').textContent="《"+t.name+"》";
  $('rBody').innerHTML=t.body.map(p=>"<p>"+p+"</p>").join("");
  $('rRate').textContent=t.rate;
  $('rRx').textContent=t.rx;
  $('rPair').textContent="《"+t.pair+"》";
  show('s-result');
}

$('go').onclick=()=>{ idx=0; sc={R:0,K:0,G:0,J:0,S:0,M:0}; render(); show('s-quiz'); };
$('again').onclick=()=>{ show('s-start'); };
</script>
</body>
</html>
